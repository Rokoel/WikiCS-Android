plugins { id 'com.android.application' }

android {
    namespace 'site.wikics.reader'
    compileSdk 35
    defaultConfig {
        applicationId 'site.wikics.reader'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}
