name: Android build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run core tests
        run: sh tools/test.sh

      - name: Build APK and run lint
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: WikiCS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download the successful build
        run: gh run download "$GITHUB_RUN_ID" --name WikiCS-debug-apk --dir dist

      - name: Publish APK release
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/WikiCS.apk

          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cat > release-notes.md <<EOF
          Automated build of commit ${GITHUB_SHA}.

          Download WikiCS.apk below to install the app.
          This is a debug APK, not a production-signed Android release.

          Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          gh release create "$tag" dist/WikiCS.apk \
            --target "$GITHUB_SHA" \
            --title "WikiCS build ${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})" \
            --notes-file release-notes.md
